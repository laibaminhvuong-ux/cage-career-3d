# Builds the downloads for every platform when a release is published (or on demand for a tag)
# and attaches them to that release: Windows installer + portable zip, Mac (Apple Silicon and
# Intel), Linux AppImage and an Android APK. The game itself is dist/site, committed by the
# integrator; personal careers (saves/) are left out.
name: Build downloads
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the downloads to, e.g. v1.12.0 (built from the selected branch)"
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage the game
        shell: bash
        run: |
          rm -rf desktop/site && cp -r dist/site desktop/site && rm -rf desktop/site/saves
      - name: Build
        shell: bash
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          case "$RUNNER_OS" in
            macOS) npx electron-builder --mac --publish never ;;
            Linux) npx electron-builder --linux --publish never ;;
            Windows) npx electron-builder --win --x64 --publish never ;;
          esac
      - name: Attach to the release
        shell: bash
        run: |
          files=$(ls desktop/release/Cage-Career-3D-* desktop/release/latest*.yml | grep -E '\.(exe|zip|dmg|AppImage|yml|blockmap)$')
          gh release upload "$TAG" $files --clobber

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the APK
        working-directory: mobile
        run: |
          rm -rf www && cp -r ../dist/site www && rm -rf www/saves
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          # launcher icon: the game's logo emblem instead of Capacitor's default
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do for n in ic_launcher ic_launcher_round ic_launcher_foreground; do cp ../web/icons/icon-192.png "$d/$n.png"; done; done
          cd android
          sed -i "s/versionName \".*\"/versionName \"${TAG#v}\"/" app/build.gradle
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Cage-Career-3D-android.apk"
      - name: Attach to the release
        run: gh release upload "$TAG" "Cage-Career-3D-android.apk" --clobber
